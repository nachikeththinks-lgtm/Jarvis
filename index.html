<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #05080d;
      color: #00d9ff;
      font-family: Arial, sans-serif;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 48px;
      letter-spacing: 8px;
      margin-bottom: 10px;
    }

    #status {
      color: #8defff;
      margin-bottom: 35px;
    }

    #orb {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 3px solid #00d9ff;
      box-shadow:
        0 0 20px #00d9ff,
        0 0 60px #007a99,
        inset 0 0 30px #007a99;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 35px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 20px #00d9ff;
      }

      50% {
        transform: scale(1.05);
        box-shadow: 0 0 60px #00d9ff;
      }

      100% {
        transform: scale(1);
        box-shadow: 0 0 20px #00d9ff;
      }
    }

    button {
      background: transparent;
      color: #00d9ff;
      border: 2px solid #00d9ff;
      border-radius: 30px;
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 0 15px #007a99;
    }

    button:active {
      background: #003542;
    }

    #output {
      margin-top: 30px;
      max-width: 85%;
      color: white;
      font-size: 18px;
      min-height: 50px;
    }
  </style>
</head>

<body>

  <h1>JARVIS</h1>

  <div id="status">SYSTEM STANDBY</div>

  <div id="orb">J</div>

  <button onclick="listen()">🎙️ ACTIVATE</button>

  <div id="output">
    Good day, sir. JARVIS online.
  </div>

<script>

function speak(text) {

  const voice = new SpeechSynthesisUtterance(text);

  const voices = speechSynthesis.getVoices();

  // Look for a natural English voice
  const preferredVoice =
    voices.find(v => v.lang === "en-GB") ||
    voices.find(v => v.lang.startsWith("en-GB")) ||
    voices.find(v => v.lang.startsWith("en"));

  if (preferredVoice) {
    voice.voice = preferredVoice;
  }

  voice.lang = "en-GB";
  voice.rate = 0.88;
  voice.pitch = 0.75;
  voice.volume = 1;

  speechSynthesis.cancel();
  speechSynthesis.speak(voice);
}

function respond( text){

  if (text.toLowerCase().startsWith("calculate ")) {

  let expression = text.substring(10).toLowerCase().trim();

    expression = expression.replace(/√\s*(\d+(?:\.\d+)?)/g, "square root of $1");
    
  // Square root
if (
  expression.startsWith("the square root of ") ||
  expression.startsWith("square root of ") ||
  expression.startsWith("square root ") ||
  expression.endsWith(" square root")
) {

  let numberText = expression
    .replace("the square root of ", "")
    .replace("square root of ", "")
    .replace("square root ", "")
    .replace(" square root", "")
    .trim();

  const number = parseFloat(numberText);

  if (!isNaN(number) && number >= 0) {
    return "The answer is " + Math.sqrt(number) + ", sir.";
  }

  return "I couldn't calculate that, sir.";
}
  

  // Powers
  expression = expression
    .replace(/to the power of/g, "^")
    .replace(/raised to the power of/g, "^")
    .replace(/squared/g, "^2")
    .replace(/cubed/g, "^3");

  // Basic operations
  expression = expression
    .replace(/multiplied by/g, "*")
    .replace(/times/g, "*")
    .replace(/divided by/g, "/")
    .replace(/divide by/g, "/")
    .replace(/plus/g, "+")
    .replace(/minus/g, "-");

  // Convert percentages
  expression = expression.replace(
    /(\d+(?:\.\d+)?)\s*percent of\s*(\d+(?:\.\d+)?)/g,
    "($1/100)*$2"
  );

  // Only allow numbers and basic math symbols
  if (!/^[0-9+\-*/^().\s]+$/.test(expression)) {
    return "I couldnt calculate that, sir.";
  }

  try {
    // Handle powers
    expression = expression.replace(
      /(\d+(?:\.\d+)?)\s*\^\s*(\d+(?:\.\d+)?)/g,
      "Math.pow($1,$2)"
    );

    const result = Function(
      '"use strict"; return (' + expression + ')'
    )();

    if (typeof result === "number" && isFinite(result)) {
      return "The answer is " + result + ", sir.";
    }

    return "I couldn't calculate that, sir.";

  } catch {
    return "I couldn't calculate that, sir.";
  }
  }
  
  if (text.toLowerCase().startsWith("search youtube for ")) {
    const query = text.substring(19);
    window.open(
      "https://www.youtube.com/results?search_query=" + encodeURIComponent(query),
      "_blank"
    );
    return "Searching YouTube for " + query + ", sir.";
      }
  
  if (text.toLowerCase().startsWith("search google for ")) {
    const query = text.substring(18);
    window.open(
      "https://www.google.com/search?q=" + encodeURIComponent(query),
      "_blank"
    );
    return "Searching Google for " + query + ", sir.";
    }

  // JARVIS memory
if (text.toLowerCase().startsWith("my name is ")) {
  const name = text.substring(11).trim();
  localStorage.setItem("jarvis_name", name);
  return "I'll remember your name, " + name + ", sir.";
}

if (
  text.toLowerCase().includes("what is my name") ||
  text.toLowerCase().includes("what's my name")
) {
  const name = localStorage.getItem("jarvis_name");

  if (name) {
    return "Your name is " + name + ", sir.";
  }

  return "You haven't told me your name yet, sir.";
}

  // General JARVIS memory
if (text.toLowerCase().startsWith("remember that ")) {
  const memory = text.substring(14).trim();

  if (memory) {
    const memories = JSON.parse(
      localStorage.getItem("jarvis_memories") || "[]"
    );

    memories.push(memory);
    localStorage.setItem(
      "jarvis_memories",
      JSON.stringify(memories)
    );

    return "I'll remember that, sir.";
  }
}

if (
  text.toLowerCase().startsWith("what do you remember") ||
  text.toLowerCase().startsWith("what do you know about me")
) {
  const memories = JSON.parse(
    localStorage.getItem("jarvis_memories") || "[]"
  );

  if (memories.length === 0) {
    return "I don't have any general memories stored yet, sir.";
  }

  return "I remember: " + memories.join(". ") + ".";
}
  
  text = text.toLowerCase();

  if (text.includes("hello") || text.includes("hi")) {
    return "Good day, sir. JARVIS online and ready.";
  }

  if (text.includes("who are you")) {
    return "I am JARVIS, your personal artificial intelligence assistant.";
  }

  if (text.includes("how are you")) {
    return "All systems are operating normally, sir.";
  }

  if (text.includes("time")) {
    return "The current time is " +
      new Date().toLocaleTimeString();
  }

  if (text.includes("date")) {
    return "Today's date is " +
      new Date().toLocaleDateString();
  }

  if (text.includes("open google")) {
    window.open("https://www.google.com", "_blank");
    return "Opening Google, sir.";
  }

  if (text.includes("open youtube")) {
    window.open("https://www.youtube.com", "_blank");
    return "Opening YouTube, sir.";
  }

  if (text.includes("thank")) {
    return "You're most welcome, sir.";
  }

  return "I heard you say: " + text +
    ". I don't have an answer for that command yet, sir.";
}

function listen() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    document.getElementById("output").innerText =
      "Voice recognition isn't supported in this browser.";
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "en-US";
  recognition.interimResults = false;

  document.getElementById("status").innerText =
    "LISTENING...";

  recognition.start();

  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript;

    document.getElementById("output").innerText =
      "You: " + text;

    const answer = respond(text);

    setTimeout(function() {

      document.getElementById("output").innerText =
        "JARVIS: " + answer;

      speak(answer);

    }, 500);

  };

  recognition.onend = function() {

    document.getElementById("status").innerText =
      "SYSTEM READY";

  };

}

speak("Good day, sir. JARVIS online.");

</script>

</body>
  </html>
